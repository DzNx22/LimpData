# Testa o código a cada envio e, quando uma tag de versão (v1.2.3) é enviada,
# gera o LimpData.exe e publica numa Release do GitHub.
name: Testes e release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # botão "Run workflow": gera o .exe como artefato, sem publicar

permissions:
  contents: write # necessário para criar a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes
        run: python -m pytest -q

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import limpdata; print(limpdata.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com limpdata/__init__.py ($version)."
            exit 1
          fi

      - name: Gerar executável
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: python -m PyInstaller --noconfirm limpdata.spec

      - name: Guardar executável (execução manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LimpData
          path: dist/LimpData.exe

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LimpData ${{ github.ref_name }}
          files: dist/LimpData.exe
          generate_release_notes: true
